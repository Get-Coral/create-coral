name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Check CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24
          cache: true

      - name: Lint and typecheck
        run: vp run check

      # Scaffolds a module from the template, then installs, checks and builds
      # it, so a template change that breaks new modules fails here.
      - name: Smoke test
        run: vp run test:scaffold
